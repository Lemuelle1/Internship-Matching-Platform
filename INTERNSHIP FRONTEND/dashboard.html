<!DOCTYPE html>
<link rel="stylesheet" href="style.css">
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InternLink Dashboard</title>
<link rel="stylesheet" href="dashboard.css">
</head>

<body>

<div class="sidebar">

    <h2>InternLink</h2>

    <p>🏠 Home</p>
    <p>💼 Internships</p>
    <p>📄 My CV</p>
    <p>⚙️ Settings</p>

</div>

<div class="main">

    <div class="topbar">
        <h1>Welcome Back 👋</h1>

        <input type="text" placeholder="Search internships... 🔍">
    </div>

    <div class="profile-card">

        <h3>👤 My Profile</h3>

        <p>📍 Location: Yaoundé</p>
        <p>🎓 Level: Bachelor</p>
        <p>📄 CV: Uploaded</p>

    </div>

    <h3 class="section-title">🔥 Recommended Internships</h3>

    <div class="grid">

        <div class="card">
            <h4>💻 Software Intern</h4>
            <p>📍 Yaoundé</p>
            <button>View</button>
        </div>

        <div class="card">
            <h4>🔐 Cybersecurity Intern</h4>
            <p>📍 Douala</p>
            <button>View</button>
        </div>

        <div class="card">
            <h4>📊 Data Analyst Intern</h4>
            <p>🌍 Remote</p>
            <button>View</button>
        </div>

        <div class="card">
            <h4>📢 Marketing Intern</h4>
            <p>📍 Yaoundé</p>
            <button>View</button>
        </div>

    </div>

</div>

</body>
</html>

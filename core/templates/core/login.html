{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — InternLink</title>
  <link rel="stylesheet" href="{% static 'core/styles.css' %}">
  <style>
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--cream); padding:24px; }
    .auth-card { background:var(--white); border:1px solid var(--border); border-radius:var(--r-xl); padding:48px; width:100%; max-width:440px; box-shadow:var(--shadow-lg); }
    .auth-logo { font-family:var(--font-head); font-size:20px; font-weight:800; margin-bottom:32px; display:flex; align-items:center; gap:6px; }
    .auth-logo span { color:var(--accent2); }
    .auth-title { font-size:28px; font-weight:800; margin-bottom:6px; }
    .auth-sub { color:var(--muted); font-size:14px; margin-bottom:32px; }
    .form-stack { display:flex; flex-direction:column; gap:20px; }
    .divider { text-align:center; color:var(--muted); font-size:13px; position:relative; margin:8px 0; }
    .divider::before,.divider::after { content:''; position:absolute; top:50%; width:42%; height:1px; background:var(--border); }
    .divider::before { left:0; }
    .divider::after { right:0; }
  </style>
</head>
<body>
<div class="auth-card">
  <a href="/" class="auth-logo">Intern<span>Link</span><div class="logo-dot"></div></a>
  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-sub">Sign in to your account to continue</p>
  <form class="form-stack" id="loginForm">
    <div class="form-group">
      <label class="form-label">Email address</label>
      <input type="email" class="form-input" id="email" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" id="password" placeholder="Your password" required>
    </div>
    <button type="submit" class="btn btn-primary w-full" id="submitBtn" style="justify-content:center;padding:14px;">
      Sign In
    </button>
  </form>
  <p class="text-center text-sm mt-16">
    <a href="#" onclick="forgotPassword();return false;" style="color:var(--accent2);font-weight:600;">
      Forgot Password?
    </a>
  </p>
  <p class="text-center text-sm text-muted mt-24">
    Don't have an account? <a href="/register/" style="color:var(--accent2);font-weight:600;">Create one free</a>
  </p>
</div>
<script src="{% static 'core/app.js' %}"></script>
<script>
  redirectIfLoggedIn();
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in...';
    try {
      const data = await apiFetch('/auth/login/', {
        method: 'POST',
        body: JSON.stringify({
          email:    document.getElementById('email').value,
          password: document.getElementById('password').value,
        })
      });
      Auth.setAuth(data.token, data.user);
      toast('Welcome back, ' + data.user.first_name + '!', 'success');
      setTimeout(() => {
        window.location.href = data.user.role === 'ADMIN' ? '/admin-panel/' : '/dashboard/';
      }, 800);
    } catch (err) {
      toast(err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = 'Sign In';
    }
  });

  async function forgotPassword() {
    const email = prompt("Enter your email address:");
    if (!email) return;
    try {
      await apiFetch('/auth/forgot-password/', {
        method: 'POST',
        body: JSON.stringify({ email })
      });
      toast("Password reset instructions sent.", "success");
    } catch(e) { toast(e.message, "error"); }
  }
</script>
</body>
</html>
